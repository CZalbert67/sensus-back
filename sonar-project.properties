# SonarCloud project configuration — Sensus Backend
# Alineado a constitution.md v1.2.0 (Principio V) y AGENTS.md §11

# La clave la autogenera SonarCloud al importar el repositorio:
#   <organización>_<repositorio>  →  sensus-proj_sensus-back
sonar.projectKey=sensus-proj_sensus-back
sonar.organization=sensus-proj
sonar.projectName=Sensus Backend
sonar.projectVersion=2.0.0

sonar.sources=src/
sonar.tests=tests/
sonar.exclusions=src/**/bin/**,src/**/obj/**,tests/**/bin/**,tests/**/obj/**

# Program.cs es el composition root: no contiene lógica de negocio y no se cubre con pruebas.
# Adaptadores de E/S externos (MongoDB, Cloudinary, correo, geocodificación): AGENTS.md §11 los
# valida con dobles/Testcontainers, fuera del alcance de las pruebas unitarias de este pipeline.
sonar.coverage.exclusions=**/bin/**,**/obj/**,**/*.Generated*.cs,**/Properties/**,**/Migrations/**,**/Program.cs,**/Persistence/Mongo/**,**/Services/CloudinaryImageStorage.cs,**/Services/HttpMailerEmailSender.cs,**/Services/NominatimGeocodingService.cs

# XPlat Code Coverage escribe un reporte por proyecto de test en subcarpetas GUID.
# Se usa OpenCover porque es el formato recomendado por Sonar para C# con Coverlet.
sonar.cs.opencover.reportsPaths=./artifacts/coverage/**/coverage.opencover.xml
sonar.cs.vstest.reportsPaths=./artifacts/coverage/**/*.trx

sonar.cpd.exclusions=**/Program.cs,**/Startup.cs

sonar.qualitygate.wait=true
